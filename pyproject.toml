[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nginx-wp-lint"
version = "0.1.0"
description = "Lint nginx configuration for WordPress and PHP sites: security, headers, TLS, caching and PHP-FPM pitfalls, with SARIF output."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Saizul Amin" }]
keywords = ["nginx", "linter", "wordpress", "php-fpm", "security", "sarif", "devops", "configuration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    # tomllib joined the standard library in 3.11.
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
yaml = ["PyYAML>=5.4"]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "PyYAML>=5.4",
]

[project.urls]
Homepage = "https://github.com/saizul/nginx-wp-lint"
Issues = "https://github.com/saizul/nginx-wp-lint/issues"
Changelog = "https://github.com/saizul/nginx-wp-lint/blob/main/CHANGELOG.md"

[project.scripts]
nginx-wp-lint = "nginx_wp_lint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["SIM108", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
