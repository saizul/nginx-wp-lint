# Hidden files, but keep ACME HTTP-01 challenges working.
location ~ /\.(?!well-known/) {
    deny all;
}

location = /wp-config.php {
    deny all;
}

location = /xmlrpc.php {
    deny all;
    access_log off;
    log_not_found off;
}

# Never execute PHP from uploads.
location ~* ^/wp-content/uploads/.*\.(php|phtml|phar)$ {
    deny all;
}

# Backup plugins and logs.
location ~* ^/wp-content/(ai1wm-backups|updraft|backups-dup-lite|uploads/wc-logs)/ {
    deny all;
}

location ~* \.(sql|sql\.gz|bak|old|orig|save|swp|zip|tar|tar\.gz|tgz|gz|wpress|log)$|~$ {
    deny all;
}
