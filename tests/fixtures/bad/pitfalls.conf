server {
    listen 80;
    server_name pitfalls.example.com;
    index index.php;

    if ($host = www.pitfalls.example.com) {
        return 301 http://pitfalls.example.com$request_uri;
    }

    location / {
        root /var/www/pitfalls;
        if (!-e $request_filename) {
            rewrite ^(.+)$ /index.php?q=$1 last;
        }
    }

    location /static {
        alias /srv/static/;
    }

    location /images/ {
        if ($http_user_agent ~* bot) {
            add_header X-Robots-Tag noindex;
        }
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }
}

server {
    listen 80;
    server_name pitfalls.example.com;
    return 404;
}
