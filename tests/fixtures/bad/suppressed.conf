# nginx-wp-lint: disable-file=NWL013
server {
    # nginx-wp-lint: disable=xmlrpc-not-blocked,NWL060
    listen 80;
    server_name quiet.example.com;
    root /var/www/quiet;
    index index.php;
    autoindex on;  # nginx-wp-lint: disable=NWL002
    # nginx-wp-lint: disable-next-line=NWL075
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}
