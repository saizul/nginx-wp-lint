server {
    listen 80;
    server_name www.example.org example.org;
    root /var/www/org;
    index index.php;
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
}

server {
    listen 443 ssl;
    server_name example.org;
    ssl_certificate /etc/ssl/org.pem;
    ssl_certificate_key /etc/ssl/org.key;
    root /var/www/org;
    index index.php;
    location / {
        try_files $uri $uri/ /index.php?$args;
    }
}

server {
    listen 80;
    listen 443 ssl;
    server_name both.example.org;
    ssl_certificate /etc/ssl/both.pem;
    ssl_certificate_key /etc/ssl/both.key;
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }
    root /var/www/both;
}
