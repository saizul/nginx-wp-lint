# Server-level if guards with return are understood.
server {
    listen 80;
    server_name guard.example.com;
    root /var/www/guard;
    index index.php;

    if ($request_uri ~* "/\.(git|env|htaccess|svn|user\.ini)") {
        return 403;
    }
    if ($uri ~* "^/xmlrpc\.php$") {
        return 444;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}
