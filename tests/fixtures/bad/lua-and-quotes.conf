server {
    listen 80;
    server_name "lua.example.com";
    root '/var/www/with space';
    set $x "a;b{c}";
    content_by_lua_block {
        local t = { a = "}" }
        ngx.say("hello { world }")  -- a comment with }
    }
    location ~ "^/(?<year>\d{4})/" {
        return 200 "year $year";
    }
    location = /exact {
        return 204;
    }
    location ~* \.PHP$ {
        fastcgi_pass ${php_backend};
    }
}
