# A typical copy-pasted WordPress site file with many problems.
server {
    listen 80;
    server_name blog.example.com;
    root /var/www/blog;
    index index.php index.html;
    autoindex on;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Looks protective, but the regex PHP location below still wins.
    location /wp-content/uploads/ {
        expires 30d;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
    }
}
